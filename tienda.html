<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - Bear Tech</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main>
    <div id="productos"></div>
  </main>

  <footer>
    <p>&copy; 2025 Bear Tech</p>
  </footer>

  <script src="js/navbar-data.js"></script>
  <script>
    fetch("js/navbar.js")
      .then(res => res.text())
      .then(code => {
        const script = document.createElement("script");
        script.innerHTML = code;
        document.body.appendChild(script);

        // Una vez que navbar se carga, cargamos cards.js
        const cardsScript = document.createElement("script");
        cardsScript.src = "js/cards.js";
        document.body.appendChild(cardsScript);
      });
  </script>
</body>
</html>
