<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrarse - Bear Tech</title>
  <link rel="stylesheet" href="css/estilos.css" />
  <script src="js/navbar-data.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/registro.js" defer></script>
</head>
<body class="registro-page">
  <div id="navbar-container"></div>

  <main class="login-container registro-page">
    <div class="register-card">
      <h2>Crear cuenta</h2>
      <p>Completa tus datos para registrarte</p>
      <form id="formRegistro">
        <label for="nombre">Nombre</label>
        <div class="input-icon">
          <input type="text" id="nombre" required />
        </div>

        <label for="apellido">Apellido</label>
        <div class="input-icon">
          <input type="text" id="apellido" required />
        </div>

        <label for="email">Email</label>
        <div class="input-icon">
          <input type="email" id="email" required />
        </div>

        <label for="contrasena">Contraseña</label>
        <div class="input-icon">
          <input type="password" id="contrasena" required />
          <span class="icon" onclick="togglePasswordVisibility('contrasena', this)">👁️</span>
        </div>

        <label for="repetirContrasena">Repetir contraseña</label>
        <div class="input-icon">
          <input type="password" id="repetirContrasena" required />
        </div>

        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <div class="input-icon">
          <input type="date" id="fechaNacimiento" required />
        </div>

        <button type="submit">Registrarse</button>
      </form>

      <div class="center">
        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Bear Tech</p>
  </footer>

  <script>
    function togglePasswordVisibility(inputId, iconElement) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        iconElement.textContent = "🙈";
      } else {
        input.type = "password";
        iconElement.textContent = "👁️";
      }
    }
  </script>
</body>
</html>
